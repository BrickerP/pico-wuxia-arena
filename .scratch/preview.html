  <script>
    (() => {
      const spec = JSON.parse(document.getElementById('pico-design-spec').textContent);
      document.title = spec.metadata.projectName;
      const embeddedAssets = JSON.parse(document.getElementById('pico-embedded-assets').textContent);
      const nodes = new Map(spec.nodes.map(node => [node.id, node]));
      const actions = new Map(spec.actions.map(action => [action.id, action]));
      const transitions = new Map(spec.transitions.map(transition => [transition.id, transition]));
      const surfaces = new Map(spec.surfaces.map(surface => [surface.id, surface]));
      let stateId = spec.initialStateId;
      let dataCase = 'normal';
      const liveElements = new Map();

      const kebab = value => value.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
      const themeValue = token => spec.theme.brandColors[token] || `var(--sui-${kebab(token)})`;
      const getPath = (source, path) => path.split('.').reduce((value, key) => value == null ? undefined : value[key], source);
      const stateData = () => spec.dataCases[dataCase].stateSamples[stateId];
      const state = () => spec.states.find(item => item.id === stateId);

      function applyLayout(element, layout = {}) {
        element.style.display = layout.mode === 'grid' ? 'grid' : 'flex';
        element.style.flexDirection = layout.mode === 'row' ? 'row' : 'column';
        if (layout.mode === 'grid') element.style.gridTemplateColumns = `repeat(${layout.columns || 1}, minmax(0, 1fr))`;
        element.style.gap = `${layout.gapDp || 0}px`;
        const padding = layout.paddingDp;
        element.style.padding = typeof padding === 'number' ? `${padding}px` : padding ? `${padding.top}px ${padding.right}px ${padding.bottom}px ${padding.left}px` : '0';
        element.style.alignItems = ({ start:'flex-start', end:'flex-end', center:'center', stretch:'stretch', baseline:'baseline' })[layout.align] || '';
        element.style.justifyContent = ({ start:'flex-start', end:'flex-end', center:'center', 'space-between':'space-between', 'space-around':'space-around' })[layout.justify] || '';
        if (layout.widthDp) element.style.width = `${layout.widthDp}px`;
        if (layout.heightDp) element.style.height = `${layout.heightDp}px`;
        if (layout.grow != null) element.style.flexGrow = String(layout.grow);
        if (layout.overflow) element.style.overflow = layout.overflow === 'scroll' ? 'auto' : layout.overflow;
      }

      function applyAppearance(element, appearance) {
        if (!appearance) return;
        if (appearance.fill) {
          element.dataset.designSurface = element.dataset.nodeId;
          element.style.setProperty('--pico-design-surface-fill', themeValue(appearance.fill));
        }
        if (appearance.foreground) element.style.color = themeValue(appearance.foreground);
        if (appearance.radiusDp != null) element.style.borderRadius = `${appearance.radiusDp}px`;
        if (appearance.opacity != null) element.style.opacity = String(appearance.opacity);
        if (appearance.depthDp != null) element.style.transform = `translateZ(${appearance.depthDp}px)`;
      }

      function wireEvents(element, node) {
        Object.entries(node.events || {}).forEach(([eventName, actionId]) => {
          element.addEventListener(eventName, () => dispatchAction(actionId));
        });
      }

      function renderDirectionSeal(node, data) {
        const root = document.createElement('div');
        root.className = 'node direction-seal';
        const label = document.createElement('span');
        label.className = 'direction-seal-label';
        label.textContent = node.props.label;
        const cells = document.createElement('div');
        cells.className = 'direction-cells';
        const active = getPath(data, node.bindings.direction) || 'none';
        if (active === 'none') return root;
        const part = node.parts.directionCell;
        node.props.directions.filter(direction => direction.id === active).forEach(direction => {
          const cell = document.createElement('span');
          cell.className = 'direction-cell';
          cell.textContent = direction.label;
          applyAppearance(cell, direction.id === active ? { ...part.appearance, ...part.states.active } : part.appearance);
          cell.setAttribute('aria-label', direction.id === active ? `${direction.label}路来势` : direction.label);
          cells.append(cell);
        });
        if (active === 'none') label.textContent = node.props.idleLabel;
        root.append(label, cells);
        return root;
      }

      function renderNode(nodeId, data) {
        const node = nodes.get(nodeId);
        if (!node || (node.visibleInStates && !node.visibleInStates.includes(stateId))) return null;
        let element;
        if (node.kind === 'layout') {
          element = document.createElement('div');
          applyLayout(element, node.layout);
        } else if (node.kind === 'text') {
          element = document.createElement('div');
          element.className = 'text-node';
          element.textContent = node.bindings?.content ? getPath(data, node.bindings.content) : node.content;
          const type = spec.theme.typography[node.textStyle.typography];
          element.style.fontSize = `${type.sizeDp}px`;
          element.style.lineHeight = `${type.lineHeightDp}px`;
          element.style.fontWeight = String(type.weight);
          element.style.color = themeValue(node.textStyle.color);
          element.style.textAlign = node.textStyle.align || 'start';
        } else if (node.kind === 'spatialui') {
          element = document.createElement(node.component);
          const props = { ...(node.props || {}) };
          Object.entries(node.bindings || {}).forEach(([key, path]) => { props[key] = getPath(data, path); });
          Object.entries(props).forEach(([key, value]) => {
            if (key === 'containerColorRole' || key === 'contentColorRole') return;
            if (typeof value === 'boolean') element.toggleAttribute(kebab(key), value);
            else if (value != null) element.setAttribute(kebab(key), String(value));
          });
          if (node.component === 'sui-button') {
            if (props.containerColorRole) element.setAttribute('container-color', themeValue(props.containerColorRole));
            if (props.contentColorRole) element.setAttribute('content-color', themeValue(props.contentColorRole));
          }
        } else if (node.kind === 'media') {
          const asset = spec.assets.find(item => item.id === node.assetId);
          element = document.createElement('img');
          element.className = 'media-node';
          element.src = embeddedAssets[node.assetId] || asset.src;
          element.alt = asset.alt || '';
          element.style.objectFit = node.props?.fit || 'contain';
        } else if (node.kind === 'domain_visual' && node.rendererKey === 'attack-direction-seal') {
          element = renderDirectionSeal(node, data);
        } else {
          element = document.createElement('div');
        }
        element.dataset.nodeId = node.id;
        element.id = node.id;
        element.classList.add('node');
        if (node.accessibilityLabel) element.setAttribute('aria-label', node.accessibilityLabel);
        applyAppearance(element, node.appearance);
        if (node.kind !== 'layout' && node.layout) applyLayout(element, node.layout);
        wireEvents(element, node);
        (node.children || []).forEach(childId => {
          const child = renderNode(childId, data);
          if (child) element.append(child);
        });
        liveElements.set(node.id, element);
        return element;
      }

      function applyResponsive(surface, width) {
        spec.responsiveRules.filter(rule => rule.surfaceId === surface.id).forEach(rule => {
          const matches = (rule.when.maxWidthDp == null || width <= rule.when.maxWidthDp) && (rule.when.minWidthDp == null || width >= rule.when.minWidthDp);
          if (!matches) return;
          rule.overrides.forEach(override => {
            const element = liveElements.get(override.nodeId);
            if (element && override.layout) applyLayout(element, override.layout);
            if (element && override.hidden) element.hidden = true;
          });
        });
      }

      function positionSurface(element, surface, maxAbsX) {
        if (surface.type === 'stage_full') {
          element.classList.add('spatial-stage-context');
          element.style.inset = '0';
          element.style.width = '100%';
          element.style.height = '100%';
          element.style.borderRadius = '0';
          element.style.background = 'transparent';
          element.style.backdropFilter = 'none';
          element.style.boxShadow = 'none';
          element.style.transform = 'none';
          return;
        }
        const placement = surface.placement || {};
        const position = placement.positionMeters || { x: 0, y: 1.1 };
        const normalizedX = maxAbsX ? position.x / maxAbsX : 0;
        const availableWidth = Math.max(surface.minSize.width, innerWidth / 2 - 36);
        const intendedWidth = Math.min(surface.defaultSize.width, surface.maxSize.width, availableWidth);
        const edgePadding = 24;
        const left = normalizedX < 0
          ? edgePadding + intendedWidth / 2
          : normalizedX > 0
            ? innerWidth - edgePadding - intendedWidth / 2
            : innerWidth / 2;
        const verticalOffset = (1.12 - position.y) * 180;
        element.style.left = `${left}px`;
        element.style.top = `calc(50% + ${verticalOffset}px)`;
        element.style.width = `${surface.defaultSize.width}px`;
        element.style.height = `${surface.defaultSize.height}px`;
        element.style.minWidth = `${surface.minSize.width}px`;
        element.style.maxWidth = `min(${surface.maxSize.width}px, calc(50vw - 36px))`;
        element.style.minHeight = `${surface.minSize.height}px`;
        element.style.maxHeight = `${surface.maxSize.height}px`;
        element.style.transform = `translate(-50%, -50%) rotateY(${placement.yawDegrees || 0}deg)`;
      }

      function renderAll() {
        const mount = document.getElementById('mount');
        mount.replaceChildren();
        liveElements.clear();
        const data = stateData();
        const maxAbsX = Math.max(...spec.surfaces.map(surface => Math.abs(surface.placement?.positionMeters?.x || 0)), 1);
        spec.surfaces.forEach(surface => {
          const rootId = state().surfaceRoots[surface.id];
          const shell = document.createElement('section');
          shell.className = 'spatial-surface';
          shell.dataset.surfaceId = surface.id;
          shell.setAttribute('aria-label', surface.id);
          positionSurface(shell, surface, maxAbsX);
          const root = renderNode(rootId, data);
          if (root) shell.append(root);
          mount.append(shell);
          requestAnimationFrame(() => applyResponsive(surface, shell.getBoundingClientRect().width));
        });
        document.documentElement.dataset.state = stateId;
        document.documentElement.dataset.dataCase = dataCase;
      }

      function commitTransition(transition) {
        stateId = transition.to;
        renderAll();
        window.dispatchEvent(new CustomEvent('arena-state-changed', { detail: { stateId } }));
      }

      function confirmTransition(transition) {
        const copy = transition.confirmation;
        const dialog = document.createElement('sui-alert-dialog');
        dialog.setAttribute('title', copy.title);
        dialog.setAttribute('message', copy.body);
        dialog.setAttribute('orientation', 'horizontal');
        const cancel = document.createElement('sui-button');
        cancel.slot = 'buttons';
        cancel.setAttribute('size', 'small');
        cancel.setAttribute('text', copy.cancelLabel);
        const confirm = document.createElement('sui-button');
        confirm.slot = 'buttons';
        confirm.setAttribute('size', 'small');
        confirm.setAttribute('text', copy.confirmLabel);
        cancel.addEventListener('click-action', () => dialog.remove());
        confirm.addEventListener('click-action', () => { dialog.remove(); commitTransition(transition); });
        dialog.addEventListener('dismiss-request', () => dialog.remove());
        dialog.append(cancel, confirm);
        document.body.append(dialog);
      }

      function dispatchAction(actionId) {
        const action = actions.get(actionId);
        if (!action || action.type !== 'transition') return;
        const transition = transitions.get(action.transitionId);
        if (!transition || transition.from !== stateId) return;
        if (transition.confirmation) confirmTransition(transition);
        else commitTransition(transition);
      }

      function emit(eventName) {
        const transition = spec.transitions.find(item => item.from === stateId && item.trigger.event === eventName);
        if (transition) commitTransition(transition);
      }

      window.__arenaPreview = {
        get state() { return stateId; },
        get dataCase() { return dataCase; },
        setState(next) { if (spec.states.some(item => item.id === next)) { stateId = next; renderAll(); } },
        setDataCase(next) { if (spec.dataCases[next]) { dataCase = next; renderAll(); } },
        emit,
        spec
      };
      let resizeFrame = 0;
      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(renderAll);
      });
      renderAll();
    })();
  </script>
</body>
</html>
